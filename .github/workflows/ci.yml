name: CI

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          # Устанавливаем зависимости, только если файл существует
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi
          
      - name: Lint with ruff
        run: |
          # Проверяем только существующие папки, чтобы не было ошибки
          if [ -d "src" ]; then ruff check src; fi
          if [ -d "tests" ]; then ruff check tests; fi
          
      - name: Run tests
        run: |
          # Запускаем тесты, только если папка tests существует
          if [ -d "tests" ]; then pytest tests/; fi
