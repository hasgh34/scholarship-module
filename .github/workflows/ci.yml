name: CI

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov black isort pylint PyYAML reportlab
          
      - name: Check formatting (Black & isort)
        run: |
          if [ -d "src" ]; then black --check src tests; fi
          if [ -d "tests" ]; then isort --check-only src tests; fi
          
      - name: Lint with Pylint
        run: |
          if [ -d "src" ]; then pylint src; fi
          if [ -d "tests" ]; then pylint tests; fi
          
      - name: Run tests
        run: |
          if [ -d "tests" ]; then pytest --cov=src --cov-report=term-missing tests/; fi
