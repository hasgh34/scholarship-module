name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установка зависимостей
        run: pip install -e ".[dev]"
      - name: Форматирование и стиль
        run: |
          black --check src tests
          isort --check src tests
          pylint src --fail-under=8
      - name: Тесты и покрытие
        run: pytest --cov=src/scholarship --cov-report=term-missing --cov-fail-under=80
