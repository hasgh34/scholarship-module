name: CI

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov black isort pylint PyYAML reportlab

      - name: Check formatting (Black & isort)
        continue-on-error: true
        run: |
          black --check -l 110 src tests
          isort --check-only --profile black -l 110 src tests

      - name: Lint with Pylint
        continue-on-error: true
        run: |
          pylint src --fail-under=8 --disable=C0114,C0116,R0903,C0103,R0914,R0913,R0917

      - name: Run tests
        run: |
          pytest --cov=src/scholarship --cov-report=term-missing --cov-fail-under=80 tests/
      - name: Show project layout
        run: |
          pwd
          ls -R src | head -40
          ls tests
