[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarship-module"
version = "0.1.0"
description = "Модуль расчёта стипендии и рейтинга студента"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "reportlab>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "black>=24.0", "isort>=5.13", "pylint>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 110

[tool.isort]
profile = "black"
line_length = 110

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pylint.main]
max-line-length = 110
fail-under = 0 
disable = [
  "missing-module-docstring", "missing-function-docstring", "too-few-public-methods",
  "invalid-name", "too-many-locals", "too-many-arguments", "too-many-positional-arguments",
]
